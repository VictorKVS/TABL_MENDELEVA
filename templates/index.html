<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Периодическая таблица</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="header">
    Периодическая таблица Менделеева

    <button class="theme-switch" onclick="toggleTheme()" id="themeButton">
        🌙
    </button>
</div>

<div class="container">

    <!-- Форма поиска -->
    <form action="/search" method="get">
        <input type="text" name="q" placeholder="Введите элемент или символ" required>
        <button type="submit">Поиск</button>
    </form>

    <div class="grid">
        {% for el in elements %}
            <a href="/element/{{ el.id }}"
               class="element {{ el.group }}"
               style="grid-column: {{ el.x }}; grid-row: {{ el.y }};">
                {{ el.symbol }}<br>
                <small>{{ el.id }}</small>
            </a>
        {% endfor %}
    </div>

</div>

<!-- ======= ТЁМНАЯ ТЕМА ======= -->
<script>
function toggleTheme() {
    const body = document.body;
    const btn = document.getElementById("themeButton");

    body.classList.toggle("dark");

    if (body.classList.contains("dark")) {
        localStorage.setItem("theme", "dark");
        btn.textContent = "☀";
    } else {
        localStorage.setItem("theme", "light");
        btn.textContent = "🌙";
    }
}

// При загрузке страницы — восстановить тему
window.onload = function () {
    const theme = localStorage.getItem("theme");
    const btn = document.getElementById("themeButton");

    if (theme === "dark") {
        document.body.classList.add("dark");
        btn.textContent = "☀";
    } else {
        btn.textContent = "🌙";
    }
};
</script>

</body>
</html>
